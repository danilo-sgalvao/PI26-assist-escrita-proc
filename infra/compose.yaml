services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: assistente
      POSTGRES_USER: assistente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistente_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-35432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistente -d assistente"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dados_postgres:
